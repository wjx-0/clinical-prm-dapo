# Fast data-loading smoke test for the sealed v2_11k clean 10k SFT dataset.
# Run:
#   bash scripts/train/run_sft_7b_smoke.sh

### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true
flash_attn: auto

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### qlora
quantization_bit: 4
quantization_method: bitsandbytes

### dataset
dataset_dir: data/sft/v2_11k
dataset: medical_cot_sft_v2_11k_clean10k
template: qwen
cutoff_len: 4096
max_samples: 200
overwrite_cache: true
preprocessing_num_workers: 4
packing: false
val_size: 0.05

### output
output_dir: outputs/sft/qwen25-7b-lora-smoke-v2_11k-clean10k
logging_steps: 1
save_steps: 20
plot_loss: true
overwrite_output_dir: true
save_total_limit: 1
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
max_steps: 20
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 10
